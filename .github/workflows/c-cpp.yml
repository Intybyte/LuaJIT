
name: C/C++ CI

on:
  push:
    branches: [ "v2.1" ]
  pull_request:
    branches: [ "v2.1" ]

jobs:
  build:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4

    - name: Setup MSYS2
      uses: msys2/setup-msys2@v2
      with:
        msystem: UCRT64
        update: true
        install: >-
          mingw-w64-i686-gcc
          make

    - name: Make (x86)
      shell: msys2 {0}
      run: |
        make clean
        make XCFLAGS="-DLUAJIT_DISABLE_GC64"

    - name: Upload Windows executable
      uses: actions/upload-artifact@v4
      with:
        name: windows-build
        path: |
          *.exe
          **/*.exe
          *.dll
          **/*.dll
          *.dll.a
          **/*.dll.a
          *.pdb
          **/*.pdb
        if-no-files-found: warn
