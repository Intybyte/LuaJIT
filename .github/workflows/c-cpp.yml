
name: C/C++ CI

on:
  push:
    branches: [ "v2.1" ]
  pull_request:
    branches: [ "v2.1" ]

jobs:
  build:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4

    - name: Setup MSYS2
      uses: msys2/setup-msys2@v2
      with:
        msystem: MINGW64
        update: true
        install: >-
          mingw-w64-x86_64-gcc
          mingw-w64-x86_64-make

    - name: Configure
      shell: msys2 {0}
      run: ./configure

    - name: Make
      shell: msys2 {0}
      run: make

    - name: Make check
      shell: msys2 {0}
      run: make check

    - name: Make distcheck
      shell: msys2 {0}
      run: make distcheck

    - name: Upload Windows executable
      uses: actions/upload-artifact@v4
      with:
        name: windows-build
        path: |
          *.exe
          **/*.exe
          *.dll
          **/*.dll
          *.dll.a
          **/*.dll.a
          *.pdb
          **/*.pdb
        if-no-files-found: warn
