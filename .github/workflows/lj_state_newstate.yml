
name: C/C++ CI lj_state_newstate

on:
  push:
    branches: [ "v2.1" ]
  pull_request:
    branches: [ "v2.1" ]

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Build LuaJIT
        shell: cmd
        working-directory: src
        run: msvcbuild.bat nogc64

      - name: Upload Windows executable
        uses: actions/upload-artifact@v4
        with:
          name: windows-build
          path: |
            *.exe
            **/*.exe
            *.dll
            **/*.dll
            *.dll.a
            **/*.dll.a
            *.pdb
            **/*.pdb
          if-no-files-found: warn
